# mycelium-l1 — standalone workspace (extracted from tzervas/mycelium; see CROSS-REF.md).
# Container layout: the crate lives at crates/mycelium-l1 so its CARGO_MANIFEST_DIR/../../lib
# fixture paths (self-hosted compiler + std .myc differentials) resolve to this repo's lib/,
# byte-identical to the monorepo layout — zero source divergence.
[workspace]
resolver = "2"
members = [
    "crates/mycelium-l1",
]

[workspace.package]
version = "0.464.0"
edition = "2021"
rust-version = "1.96.1"
license = "MIT"
repository = "https://github.com/tzervas/mycelium-l1"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"

[workspace.lints.rust]
# ADR-014: unsafe permitted-but-documented; the check is clippy::undocumented_unsafe_blocks.
unsafe_code = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

# G2 never-silent arithmetic: release builds panic on overflow (monorepo parity).
[profile.release]
overflow-checks = true

# Unify mycelium-runtime crates onto gate A1 (`HostOpRegistry` / `HostCapabilities`).
# `mycelium-mlir` (codegen pin `505448c`) still declares the pre-A1 rev in its own Cargo.toml;
# Cargo refuses a same-URL git→git rev patch, so we path-patch the pinned A1 tree under
# `vendor/mycelium-runtime` (see `vendor/README.md`). Fleet pin-bump of codegen retires this.
[patch."https://github.com/tzervas/mycelium-runtime"]
mycelium-interp = { path = "vendor/mycelium-runtime/crates/mycelium-interp" }
mycelium-cert = { path = "vendor/mycelium-runtime/crates/mycelium-cert" }
mycelium-diag = { path = "vendor/mycelium-runtime/crates/mycelium-diag" }
mycelium-select = { path = "vendor/mycelium-runtime/crates/mycelium-select" }
mycelium-sched = { path = "vendor/mycelium-runtime/crates/mycelium-sched" }
mycelium-rt-abi = { path = "vendor/mycelium-runtime/crates/mycelium-rt-abi" }
